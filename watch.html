<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Watch — Tenny Lu</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,600&family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Inter',sans-serif;
    background:linear-gradient(180deg,#1a2a3e 0%,#0d1520 100%);
    color:#fff;min-height:100vh;display:flex;flex-direction:column;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;
  }

  /* 頂部列 */
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:1.6rem clamp(1.5rem,5vw,4rem);position:relative;z-index:10;
  }
  .back-btn{
    background:none;border:1px solid rgba(255,255,255,.25);cursor:pointer;
    color:#fff;font-family:'Inter',sans-serif;font-size:.74rem;letter-spacing:.2em;
    text-transform:uppercase;font-weight:400;padding:.6rem 1.3rem;border-radius:30px;
    display:flex;align-items:center;gap:.5rem;transition:.3s;text-decoration:none;
  }
  .back-btn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.5)}
  .back-btn svg{width:14px;height:14px;fill:#fff}
  .brand-name{
    font-family:'Cormorant Garamond',serif;font-size:1.3rem;letter-spacing:.06em;
    color:rgba(255,255,255,.6);font-weight:400;
  }

  /* 主體 */
  main{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:1rem 1.5rem 3rem;
  }
  .video-wrap{
    width:100%;max-width:1000px;position:relative;
  }
  .video-wrap video{
    width:100%;border-radius:10px;
    box-shadow:0 40px 100px -20px rgba(0,0,0,.7);
    background:#000;
  }
  .video-info{
    max-width:1000px;width:100%;margin:1.8rem auto 0;text-align:center;
  }
  .video-info .cat{
    font-size:.72rem;letter-spacing:.34em;text-transform:uppercase;
    color:rgba(255,255,255,.45);font-weight:400;margin-bottom:.5rem;
  }
  .video-info h1{
    font-family:'Cormorant Garamond',serif;font-weight:600;
    font-size:clamp(1.8rem,4vw,2.8rem);line-height:1.1;margin-bottom:.8rem;
  }
  .video-info h1 em{font-style:italic;color:#5ba3ff;font-weight:600}
  .video-info p{
    font-size:1rem;line-height:1.8;color:rgba(255,255,255,.65);font-weight:300;
    max-width:560px;margin:0 auto;
  }
  .video-info p strong{color:#5ba3ff;font-weight:500}

  /* 底部聯絡 */
  .footer-contact{
    text-align:center;padding:2rem 1.5rem 2.5rem;
    border-top:1px solid rgba(255,255,255,.08);margin-top:auto;
  }
  .footer-contact a{
    color:rgba(255,255,255,.5);text-decoration:none;font-size:.78rem;
    letter-spacing:.2em;text-transform:uppercase;margin:0 .8rem;
    transition:color .3s;
  }
  .footer-contact a:hover{color:#5ba3ff}
</style>
</head>
<body>

<header>
  <a href="index.html" class="back-btn">
    <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    Back
  </a>
  <div class="brand-name">Tenny Lu</div>
</header>

<main>
  <div class="video-wrap">
    <video id="player" controls autoplay playsinline></video>
  </div>
  <div class="video-info">
    <div class="cat" id="vCat"></div>
    <h1 id="vTitle"></h1>
    <p id="vDesc"></p>
  </div>
</main>

<div class="footer-contact">
  <a href="mailto:tennylu2000330@gmail.com">Email</a>
  <a href="https://instagram.com/tenny_is_happy" target="_blank" rel="noopener">Instagram</a>
  <a href="index.html">Portfolio</a>
</div>

<script>
  const params=new URLSearchParams(window.location.search);
  const v=params.get('v')||'1';
  const data={
    '1':{src:'assets/work-01.mp4',cat:'Viral Content',title:'Viral Food Videos',desc:'A title that ignites curiosity, coupled with music that touches the heart, empowers a story to tell itself. Overjoyed that this video has reached <strong>over 200,000 views</strong> and <strong>3,000+ likes</strong>.'},
    '2':{src:'assets/work-02.mp4',cat:'Interview',title:'Celebrity Interview',desc:'<strong>Single-handedly directed</strong> the full production lifecycle for a celebrity interview — from concept design and scripting to cinematography and final video editing.'},
    '3':{src:'assets/work-03.mp4',cat:'Short Film',title:'Short Film Shooting',desc:'From star-studded interviews to a full micro-movie: <strong>7 days of solo hustle</strong> covering concept, shooting, editing, and post-production. Every frame crafted from scratch.'},
    '4':{src:'assets/work-04.mp4',cat:'Viral Content',title:'Viral Food Videos',desc:'A title that ignites curiosity, coupled with music that touches the heart, empowers a story to tell itself. Overjoyed that this video has reached <strong>over 200,000 views</strong> and <strong>3,000+ likes</strong>.'}
  };
  const d=data[v]||data['1'];
  document.getElementById('player').src=d.src;
  document.getElementById('vCat').textContent=d.cat;
  document.getElementById('vTitle').innerHTML=d.title.replace(/(Videos|Interview|Shooting)/,'<em>$1</em>');
  document.getElementById('vDesc').innerHTML=d.desc;
  document.title=d.title+' — Tenny Lu';
</script>
</body>
</html>
