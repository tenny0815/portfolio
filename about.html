<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>About — Tenny Lu</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,600&family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Inter',sans-serif;
    background:url('assets/hero-ocean.jpg') no-repeat center center fixed;
    background-size:cover;
    color:#1d2a38;min-height:100vh;display:flex;flex-direction:column;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,.4) 40%,rgba(255,255,255,.6) 100%);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  }

  /* 頂部 */
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:1.6rem clamp(1.5rem,5vw,4rem);position:relative;z-index:10;
  }
  .back-btn{
    background:none;border:1px solid rgba(29,42,56,.25);cursor:pointer;
    color:#1d2a38;font-family:'Inter',sans-serif;font-size:.74rem;letter-spacing:.2em;
    text-transform:uppercase;font-weight:400;padding:.6rem 1.3rem;border-radius:30px;
    display:flex;align-items:center;gap:.5rem;transition:.3s;text-decoration:none;
  }
  .back-btn:hover{background:rgba(255,255,255,.4);border-color:rgba(29,42,56,.5)}
  .back-btn svg{width:14px;height:14px;fill:#1d2a38}
  .brand-name{
    font-family:'Cormorant Garamond',serif;font-size:1.3rem;letter-spacing:.06em;
    color:rgba(29,42,56,.6);font-weight:400;
  }

  /* 主體 */
  main{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:2rem 1.5rem 3rem;position:relative;z-index:5;
  }
  .about-card{
    max-width:640px;width:100%;text-align:center;
    padding:clamp(2.5rem,6vw,4rem) clamp(1.5rem,5vw,3rem);
    background:linear-gradient(160deg,rgba(255,255,255,.6),rgba(255,255,255,.35));
    border-radius:20px;border:1px solid rgba(255,255,255,.5);
    box-shadow:0 40px 90px -30px rgba(10,33,80,.25);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    animation:fadeUp .6s cubic-bezier(.2,.7,.2,1);
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
  .about-card .kicker{
    font-size:.72rem;letter-spacing:.34em;text-transform:uppercase;
    color:#2f6fa8;font-weight:500;margin-bottom:.6rem;
  }
  .about-card h1{
    font-family:'Cormorant Garamond',serif;font-weight:600;
    font-size:clamp(2.2rem,5vw,3.4rem);line-height:1.1;color:#0a2150;margin-bottom:1.4rem;
  }
  .about-card h1 em{font-style:italic;color:#2f7fff;font-weight:600}
  .about-card .bio{
    font-size:1.1rem;line-height:1.9;color:#1d2a38;font-weight:400;
    max-width:520px;margin:0 auto 2rem;
  }
  .about-card .bio strong{
    color:#2f7fff;font-weight:600;
    background:linear-gradient(transparent 62%,rgba(47,127,255,.16) 62%);padding:0 2px;
  }
  .divider{height:1px;background:rgba(29,42,56,.12);margin:1.8rem 0}
  .contact-label{
    font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;
    color:#4a6178;font-weight:500;margin-bottom:1rem;
  }
  .contact-item{display:flex;align-items:center;justify-content:center;gap:.6rem;margin-bottom:.7rem}
  .contact-item .ctype{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:#4a6178;font-weight:500}
  .contact-item a{color:#2f7fff;text-decoration:none;font-size:1.05rem;font-weight:500;border-bottom:1px solid rgba(47,127,255,.4);padding-bottom:2px;transition:border-color .3s}
  .contact-item a:hover{border-color:#2f7fff}

  /* 底部 */
  .footer-contact{
    text-align:center;padding:2rem 1.5rem 2.5rem;position:relative;z-index:5;
    border-top:1px solid rgba(29,42,56,.08);margin-top:auto;
  }
  .footer-contact a{
    color:#4a6178;text-decoration:none;font-size:.78rem;
    letter-spacing:.2em;text-transform:uppercase;margin:0 .8rem;transition:color .3s;
  }
  .footer-contact a:hover{color:#2f7fff}
</style>
</head>
<body>

<header>
  <a href="index.html" class="back-btn">
    <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    Back
  </a>
  <div class="brand-name">Tenny Lu</div>
</header>

<main>
  <div class="about-card">
    <div class="kicker">Profile</div>
    <h1>Welcome to my <em>world</em>!</h1>
    <p class="bio">With <strong>2 years of video editing and post-production experience</strong>, I have successfully edited over <strong>100+ videos</strong>. I'm always excited for new collaborations!</p>
    <div class="divider"></div>
    <div class="contact-label">Contact Information</div>
    <div class="contact-item">
      <span class="ctype">Email</span>
      <a href="mailto:tennylu2000330@gmail.com">tennylu2000330@gmail.com</a>
    </div>
    <div class="contact-item">
      <span class="ctype">Instagram</span>
      <a href="https://instagram.com/tenny_is_happy" target="_blank" rel="noopener">@tenny_is_happy</a>
    </div>
  </div>
</main>

<div class="footer-contact">
  <a href="mailto:tennylu2000330@gmail.com">Email</a>
  <a href="https://instagram.com/tenny_is_happy" target="_blank" rel="noopener">Instagram</a>
  <a href="index.html">Portfolio</a>
</div>

</body>
</html>
